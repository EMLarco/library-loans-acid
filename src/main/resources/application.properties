spring.application.name=biblioteca-acid
server.port=${APP_PORT:8080}

# Conexión a PostgreSQL. La contraseña NUNCA se escribe aquí: se pasa por variable de entorno DB_PASSWORD.
app.db.host=${DB_HOST:localhost}
app.db.port=${DB_PORT:5432}
app.db.name=${DB_NAME:library_db}
app.db.user=${DB_USER:biblio_app}
app.db.password=${DB_PASSWORD:}

# Archivo local OPCIONAL con la contraseña (no se entrega en el ZIP). Ver config/db-local.properties.example
spring.config.import=optional:file:./config/db-local.properties

# Evita que Spring Boot configure su propio DataSource (lo crea DataSourceConfig)
spring.sql.init.mode=never

# Canal de notificación: console | email   (Liskov: ambos cumplen NotificationService)
app.notification.channel=${NOTIFICATION_CHANNEL:console}

# Servicio externo simulado (Adapter + Circuit Breaker)
app.external.base-url=${EXTERNAL_URL:http://localhost:${server.port}/external/legacy-bank}
app.circuit.failure-threshold=3
app.circuit.open-seconds=10

logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{0}) : %msg%n
